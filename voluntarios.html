 <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de voluntario</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Sistema de Avistamientos de Aves</h1>

        <nav>
             
            <a href="voluntarios.html">Registrar voluntario</a>
            <a href="avistamiento.html">Registrar avistamiento</a>
            <a href="avistamientos.html">Consultar avistamientos</a>
            <a href="indicadores.html">Indicadores</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Registro de voluntario</h2>

            <form id="formulario-voluntario">
                <p>* Campos obligatorios</p>

                <label for="nombre">Nombre: *</label>
                <input type="text" id="nombre">

                <label for="apellido">Apellido: *</label>
                <input type="text" id="apellido">

                <label for="email">Correo electrónico: *</label>
                <input type="email" id="email">

                <label for="telefono">Teléfono: *</label>
                <input type="tel" id="telefono">

                <label for="direccion">Dirección postal: *</label>
                <textarea id="direccion"></textarea>

                <label for="region">Región: *</label>
                <select id="region">
                    <option value="">Seleccione una región</option>
                    <option value="arica">Arica y Parinacota</option>
                    <option value="tarapaca">Tarapacá</option>
                    <option value="antofagasta">Antofagasta</option>
                    <option value="atacama">Atacama</option>
                    <option value="coquimbo">Coquimbo</option>
                    <option value="valparaiso">Valparaíso</option>
                    <option value="ohiggins">Libertador General Bernardo O'Higgins</option>
                    <option value="maule">Maule</option>
                    <option value="nuble">Ñuble</option>
                    <option value="biobio">Biobío</option>
                    <option value="araucania">La Araucanía</option>
                    <option value="rios">Los Ríos</option>
                    <option value="lagos">Los Lagos</option>
                    <option value="aysen">Aysén del General Carlos Ibáñez del Campo</option>
                    <option value="magallanes">Magallanes y de la Antártica Chilena</option>
                    <option value="metropolitana">Región Metropolitana de Santiago</option>
                </select>

                <label for="comuna">Comuna: *</label>
                <select id="comuna">
                    <option value="">Seleccione primero una región</option>
                </select>

                <button type="submit">Registrar voluntario</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Sistema de Avistamientos de Aves</p>
    </footer>

    <script src="voluntarios.js"></script> 

</body>

</html>
